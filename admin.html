<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEZ MAX HUB — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#060a12; --bg-panel:#0b111d; --line:#1c2b42;
    --blue:#2f6fed; --blue-bright:#4fa3ff; --blue-deep:#0f2559;
    --text:#e7ecf5; --text-dim:#8fa0bd;
    --danger:#e5484d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Sora',sans-serif; font-weight:700; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }

  /* LOGIN */
  #loginScreen{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%; max-width:360px;
    border:1px solid var(--line);
    background:var(--bg-panel);
    padding:36px;
  }
  .login-box h1{ font-size:1.3rem; margin-bottom:6px; }
  .login-box p.sub{ color:var(--text-dim); font-size:0.88rem; margin-bottom:24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.82rem; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field textarea, .field select{
    width:100%;
    background:#04070d;
    border:1px solid var(--line);
    border-radius:5px;
    padding:11px 14px;
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.92rem;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--blue); }
  .field textarea{ min-height:80px; resize:vertical; }
  .btn{
    background:var(--blue); color:#fff; border:none;
    padding:12px 20px; border-radius:5px; font-weight:600;
    font-size:0.9rem; cursor:pointer;
  }
  .btn:hover{ background:var(--blue-bright); }
  .btn-block{ width:100%; }
  .btn-ghost{
    background:none; border:1px solid var(--line); color:var(--text);
  }
  .btn-ghost:hover{ border-color:var(--blue-bright); }
  .btn-danger{ background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 14px; font-size:0.82rem; }
  .btn-danger:hover{ background:var(--danger); color:#fff; }
  .error-msg{ color:var(--danger); font-size:0.85rem; margin-top:10px; display:none; }

  /* APP SHELL */
  #app{ display:none; }
  header{
    border-bottom:1px solid var(--line);
    padding:18px 32px;
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; background:rgba(6,10,18,0.9); backdrop-filter:blur(8px); z-index:10;
  }
  header .brand{ display:flex; align-items:center; gap:10px; font-weight:700; }
  .logo-mark{
    width:28px;height:28px;border-radius:6px;
    background:linear-gradient(145deg, var(--blue-bright), var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:0.8rem; color:#fff;
  }
  .tabs{ display:flex; gap:4px; padding:20px 32px 0; flex-wrap:wrap; }
  .tab-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:10px 18px; font-size:0.88rem; font-weight:600; cursor:pointer;
    border-radius:5px 5px 0 0;
  }
  .tab-btn.active{ color:var(--text); border-color:var(--blue); background:var(--bg-panel); }
  main{ padding:24px 32px 64px; max-width:980px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .panel-head h2{ font-size:1.2rem; }

  .item-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
  .item-card{
    border:1px solid var(--line); background:var(--bg-panel);
    padding:18px 20px; display:flex; justify-content:space-between; gap:16px; align-items:flex-start;
  }
  .item-card .item-body{ flex:1; min-width:0; }
  .item-card h4{ font-size:0.98rem; margin-bottom:4px; }
  .item-card p{ color:var(--text-dim); font-size:0.86rem; }
  .item-card .meta{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--blue-bright); margin-bottom:6px; }
  .item-actions{ display:flex; gap:8px; flex-shrink:0; }

  .form-card{
    border:1px solid var(--line); background:var(--bg-panel);
    padding:24px;
  }
  .form-card h3{ font-size:1rem; margin-bottom:16px; }
  .form-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .form-row-2{ grid-template-columns:1fr; } }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .checkbox-row input{ width:auto; }
  .loading{ color:var(--text-dim); font-size:0.9rem; }
  .empty{ color:var(--text-dim); font-size:0.9rem; padding:20px; text-align:center; border:1px dashed var(--line); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>ADEZ MAX HUB</h1>
    <p class="sub">Admin sign in</p>
    <form id="loginForm">
      <div class="field">
        <label for="li-email">Email</label>
        <input type="email" id="li-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="li-password">Password</label>
        <input type="password" id="li-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-block">Sign in</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand"><div class="logo-mark">AM</div>Admin</div>
    <button class="btn btn-ghost" id="signOutBtn">Sign out</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="leads">Leads</button>
    <button class="tab-btn" data-tab="posts">Blog posts</button>
    <button class="tab-btn" data-tab="testimonials">Testimonials</button>
    <button class="tab-btn" data-tab="pricing">Pricing</button>
    <button class="tab-btn" data-tab="addons">Add-ons</button>
  </div>

  <main>

    <!-- LEADS -->
    <div class="panel active" id="panel-leads">
      <div class="panel-head"><h2>Contact form submissions</h2></div>
      <div class="item-list" id="leadsList"><div class="loading">Loading…</div></div>
    </div>

    <!-- POSTS -->
    <div class="panel" id="panel-posts">
      <div class="panel-head"><h2>Blog posts</h2></div>
      <div class="item-list" id="postsList"><div class="loading">Loading…</div></div>
      <div class="form-card">
        <h3>Add post</h3>
        <form id="postForm">
          <div class="field"><label>Title</label><input type="text" id="p-title" required></div>
          <div class="field"><label>Excerpt</label><textarea id="p-excerpt" required></textarea></div>
          <div class="field"><label>Published date</label><input type="date" id="p-date" required></div>
          <button type="submit" class="btn">Add post</button>
        </form>
      </div>
    </div>

    <!-- TESTIMONIALS -->
    <div class="panel" id="panel-testimonials">
      <div class="panel-head"><h2>Testimonials</h2></div>
      <div class="item-list" id="testimonialsList"><div class="loading">Loading…</div></div>
      <div class="form-card">
        <h3>Add testimonial</h3>
        <form id="testimonialForm">
          <div class="field"><label>Quote</label><textarea id="t-quote" required></textarea></div>
          <div class="form-row-2">
            <div class="field"><label>Name</label><input type="text" id="t-name" required></div>
            <div class="field"><label>Role</label><input type="text" id="t-role" required></div>
          </div>
          <button type="submit" class="btn">Add testimonial</button>
        </form>
      </div>
    </div>

    <!-- PRICING -->
    <div class="panel" id="panel-pricing">
      <div class="panel-head"><h2>Pricing plans</h2></div>
      <div class="item-list" id="pricingList"><div class="loading">Loading…</div></div>
      <div class="form-card">
        <h3>Add plan</h3>
        <form id="pricingForm">
          <div class="form-row-2">
            <div class="field"><label>Group</label>
              <select id="pr-group"><option value="consulting">Consulting</option><option value="hosting">Hosting</option></select>
            </div>
            <div class="field"><label>Name</label><input type="text" id="pr-name" required></div>
          </div>
          <div class="form-row-2">
            <div class="field"><label>Price (KES)</label><input type="number" id="pr-price" required></div>
            <div class="field"><label>Period</label><input type="text" id="pr-period" value="/mo" required></div>
          </div>
          <div class="field"><label>Features (one per line)</label><textarea id="pr-features" placeholder="Profile audit&#10;Basic growth plan"></textarea></div>
          <div class="checkbox-row"><input type="checkbox" id="pr-featured"><label for="pr-featured">Mark as "Popular"</label></div>
          <button type="submit" class="btn">Add plan</button>
        </form>
      </div>
    </div>

    <!-- ADDONS -->
    <div class="panel" id="panel-addons">
      <div class="panel-head"><h2>Add-ons</h2></div>
      <div class="item-list" id="addonsList"><div class="loading">Loading…</div></div>
      <div class="form-card">
        <h3>Add add-on</h3>
        <form id="addonForm">
          <div class="form-row-2">
            <div class="field"><label>Name</label><input type="text" id="a-name" required></div>
            <div class="field"><label>Price label</label><input type="text" id="a-price" placeholder="KES 600/mo" required></div>
          </div>
          <button type="submit" class="btn">Add add-on</button>
        </form>
      </div>
    </div>

  </main>
</div>

<script>
  var SUPABASE_URL = "https://zfuknpqadtmpzqchioze.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdWtucHFhZHRtcHpxY2hpb3plIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzYzNDUsImV4cCI6MjEwNDIxMjM0NX0.r46h-pVMUC4XeWJJEJeSUaGkQjYI_Gjylu0f0KXneS8";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function esc(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  // ---- AUTH ----
  var loginScreen = document.getElementById('loginScreen');
  var app = document.getElementById('app');

  async function checkSession(){
    var { data } = await sb.auth.getSession();
    if (data.session){
      loginScreen.style.display = 'none';
      app.style.display = 'block';
      loadAll();
    } else {
      loginScreen.style.display = 'flex';
      app.style.display = 'none';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('li-email').value.trim();
    var password = document.getElementById('li-password').value;
    var errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    var { error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error){
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      return;
    }
    checkSession();
  });

  document.getElementById('signOutBtn').addEventListener('click', async function(){
    await sb.auth.signOut();
    checkSession();
  });

  // ---- TABS ----
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function loadAll(){
    loadLeads(); loadPosts(); loadTestimonials(); loadPricing(); loadAddons();
  }

  // ---- LEADS (read-only + delete) ----
  async function loadLeads(){
    var el = document.getElementById('leadsList');
    var { data, error } = await sb.from('leads').select('*').order('created_at', { ascending:false });
    if (error){ el.innerHTML = '<div class="empty">Could not load leads.</div>'; return; }
    if (!data.length){ el.innerHTML = '<div class="empty">No submissions yet.</div>'; return; }
    el.innerHTML = data.map(function(l){
      return '<div class="item-card"><div class="item-body">' +
        '<div class="meta">' + new Date(l.created_at).toLocaleString() + ' · ' + esc(l.service || '') + '</div>' +
        '<h4>' + esc(l.name) + ' — ' + esc(l.contact) + '</h4>' +
        '<p>' + esc(l.message) + '</p>' +
        '</div><div class="item-actions"><button class="btn-danger" onclick="deleteRow(\'leads\',\'' + l.id + '\', loadLeads)">Delete</button></div></div>';
    }).join('');
  }

  // ---- POSTS ----
  async function loadPosts(){
    var el = document.getElementById('postsList');
    var { data, error } = await sb.from('posts').select('*').order('published_at', { ascending:false });
    if (error){ el.innerHTML = '<div class="empty">Could not load posts.</div>'; return; }
    if (!data.length){ el.innerHTML = '<div class="empty">No posts yet.</div>'; return; }
    el.innerHTML = data.map(function(p){
      return '<div class="item-card"><div class="item-body">' +
        '<div class="meta">' + esc(p.published_at) + '</div>' +
        '<h4>' + esc(p.title) + '</h4><p>' + esc(p.excerpt) + '</p>' +
        '</div><div class="item-actions"><button class="btn-danger" onclick="deleteRow(\'posts\',\'' + p.id + '\', loadPosts)">Delete</button></div></div>';
    }).join('');
  }
  document.getElementById('postForm').addEventListener('submit', async function(e){
    e.preventDefault();
    await sb.from('posts').insert({
      title: document.getElementById('p-title').value.trim(),
      excerpt: document.getElementById('p-excerpt').value.trim(),
      published_at: document.getElementById('p-date').value
    });
    e.target.reset();
    loadPosts();
  });

  // ---- TESTIMONIALS ----
  async function loadTestimonials(){
    var el = document.getElementById('testimonialsList');
    var { data, error } = await sb.from('testimonials').select('*').order('sort_order');
    if (error){ el.innerHTML = '<div class="empty">Could not load testimonials.</div>'; return; }
    if (!data.length){ el.innerHTML = '<div class="empty">No testimonials yet.</div>'; return; }
    el.innerHTML = data.map(function(t){
      return '<div class="item-card"><div class="item-body">' +
        '<h4>' + esc(t.name) + ' · ' + esc(t.role) + '</h4><p>' + esc(t.quote) + '</p>' +
        '</div><div class="item-actions"><button class="btn-danger" onclick="deleteRow(\'testimonials\',\'' + t.id + '\', loadTestimonials)">Delete</button></div></div>';
    }).join('');
  }
  document.getElementById('testimonialForm').addEventListener('submit', async function(e){
    e.preventDefault();
    await sb.from('testimonials').insert({
      quote: document.getElementById('t-quote').value.trim(),
      name: document.getElementById('t-name').value.trim(),
      role: document.getElementById('t-role').value.trim(),
      sort_order: 99
    });
    e.target.reset();
    loadTestimonials();
  });

  // ---- PRICING ----
  async function loadPricing(){
    var el = document.getElementById('pricingList');
    var { data, error } = await sb.from('pricing_plans').select('*').order('plan_group').order('sort_order');
    if (error){ el.innerHTML = '<div class="empty">Could not load plans.</div>'; return; }
    if (!data.length){ el.innerHTML = '<div class="empty">No plans yet.</div>'; return; }
    el.innerHTML = data.map(function(p){
      return '<div class="item-card"><div class="item-body">' +
        '<div class="meta">' + esc(p.plan_group) + (p.featured ? ' · Popular' : '') + '</div>' +
        '<h4>' + esc(p.name) + ' — KES ' + Number(p.price_kes).toLocaleString() + esc(p.period) + '</h4>' +
        '<p>' + (p.features || []).map(esc).join(' · ') + '</p>' +
        '</div><div class="item-actions"><button class="btn-danger" onclick="deleteRow(\'pricing_plans\',\'' + p.id + '\', loadPricing)">Delete</button></div></div>';
    }).join('');
  }
  document.getElementById('pricingForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var featuresRaw = document.getElementById('pr-features').value.trim();
    var features = featuresRaw ? featuresRaw.split('\n').map(function(s){ return s.trim(); }).filter(Boolean) : [];
    await sb.from('pricing_plans').insert({
      plan_group: document.getElementById('pr-group').value,
      name: document.getElementById('pr-name').value.trim(),
      price_kes: parseInt(document.getElementById('pr-price').value, 10),
      period: document.getElementById('pr-period').value.trim() || '/mo',
      features: features,
      featured: document.getElementById('pr-featured').checked,
      sort_order: 99
    });
    e.target.reset();
    document.getElementById('pr-period').value = '/mo';
    loadPricing();
  });

  // ---- ADDONS ----
  async function loadAddons(){
    var el = document.getElementById('addonsList');
    var { data, error } = await sb.from('addons').select('*').order('sort_order');
    if (error){ el.innerHTML = '<div class="empty">Could not load add-ons.</div>'; return; }
    if (!data.length){ el.innerHTML = '<div class="empty">No add-ons yet.</div>'; return; }
    el.innerHTML = data.map(function(a){
      return '<div class="item-card"><div class="item-body">' +
        '<h4>' + esc(a.name) + '</h4><p>' + esc(a.price_label) + '</p>' +
        '</div><div class="item-actions"><button class="btn-danger" onclick="deleteRow(\'addons\',\'' + a.id + '\', loadAddons)">Delete</button></div></div>';
    }).join('');
  }
  document.getElementById('addonForm').addEventListener('submit', async function(e){
    e.preventDefault();
    await sb.from('addons').insert({
      name: document.getElementById('a-name').value.trim(),
      price_label: document.getElementById('a-price').value.trim(),
      sort_order: 99
    });
    e.target.reset();
    loadAddons();
  });

  // ---- SHARED DELETE ----
  async function deleteRow(table, id, refreshFn){
    if (!confirm('Delete this item?')) return;
    await sb.from(table).delete().eq('id', id);
    refreshFn();
  }

  checkSession();
</script>

</body>
</html>
